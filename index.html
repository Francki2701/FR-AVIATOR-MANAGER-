<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FR AVIATOR V4 RAPIDE</title><style>*{box-sizing:border-box;font-family:-apple-system,sans-serif}body{margin:0;background:#0a0a12;color:#fff;padding:14px;text-align:center}h1{font-size:24px}.card{background:#1a1a2e;border:1px solid #333;border-radius:18px;padding:16px;margin-top:14px}button{padding:16px;border:0;border-radius:14px;font-weight:900;font-size:16px;width:100%;margin-top:10px}input{width:100%;padding:14px;border-radius:12px;background:#0a0a12;color:#fff;border:2px solid #f59e0b;font-size:18px;text-align:center;margin-top:10px}.b-yellow{background:#f59e0b;color:#000}.b-green{background:#16a34a;color:#fff}.pill{display:inline-block;padding:8px 12px;border-radius:20px;font-weight:800;margin:3px;background:#333}.big{font-size:22px;font-weight:900}</style></head><body>
<h1>✈️ FR AVIATOR <span style="color:#f59e0b">V4 RAPIDE</span></h1><div style="color:#aaa;font-size:12px">1 SECONDE - PAS D'ATTENTE</div>
<div class="card"><h3 style="margin:0">1. 📸 Regarde ta capture</h3><p style="color:#aaa;font-size:13px">Tu vois en haut : 1.64x, 1.58x, 1.30x, 1.02x...<br>Tape-les vite ici, séparés par virgule :</p><input id="txt" placeholder="Ex: 1.64, 1.58, 1.30, 1.02, 1.21" inputmode="decimal"><button class="b-green" onclick="go()">🚀 BAMMM - 1 SECONDE</button><div style="margin-top:10px;font-size:12px;color:#aaa">Ou clique vite :</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-top:8px"><button style="padding:10px;background:#333;color:#fff" onclick="addV(1.02)">1.02</button><button style="padding:10px;background:#333;color:#fff" onclick="addV(1.21)">1.21</button><button style="padding:10px;background:#333;color:#fff" onclick="addV(1.30)">1.30</button><button style="padding:10px;background:#333;color:#fff" onclick="addV(1.58)">1.58</button><button style="padding:10px;background:#333;color:#fff" onclick="addV(1.64)">1.64</button><button style="padding:10px;background:#333;color:#fff" onclick="addV(2.00)">2.00</button><button style="padding:10px;background:#333;color:#fff" onclick="addV(2.57)">2.57</button><button style="padding:10px;background:#333;color:#fff" onclick="addV(5)">5+</button></div><div id="liste" style="margin-top:10px"></div></div>
<div class="card" id="resCard" style="display:none"><h3 style="margin:0">🎯 RÉPONSE</h3><div id="res"></div><button class="b-yellow" onclick="reset()">🔄 NOUVELLE ANALYSE</button></div>
<div class="card"><h3 style="margin:0">💰 Mise</h3><input id="solde" type="number" value="6000" placeholder="Solde"><input id="mise" type="number" value="4000" placeholder="Mise" style="border-color:#444"><button class="b-yellow" onclick="calcul()">💰 CALCULER</button><div id="plan" style="margin-top:10px"></div></div>
<script>let vals=[];function addV(v){vals.push(v);document.getElementById('liste').innerHTML=vals.map(x=>`<span class="pill">${x}x</span>`).join('');document.getElementById('txt').value=vals.join(', ')}function go(){let t=document.getElementById('txt').value;let v=t.split(/[, ]+/).map(x=>parseFloat(x)).filter(x=>x>=1);if(v.length<3){alert('Mets au moins 3 chiffres. Ex: 1.64, 1.58, 1.30');return}analyser(v)}function analyser(vals){let moy=(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2);let m2=Math.round(vals.filter(x=>x<2).length/vals.length*100);let el=document.getElementById('resCard');el.style.display='block';let conseil,coul;if(m2>=80){conseil='🛑 STOP - NE JOUE PAS. '+m2+'% crash sous 2x';coul='#dc2626'}else if(m2>=60){conseil='⚠️ PRUDENT - Cashout 1.50x seulement';coul='#f59e0b'}else{conseil='✅ GO - Cashout 2.00x';coul='#16a34a'}document.getElementById('res').innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><div style="background:#0a0a12;padding:10px;border-radius:12px">Moyenne<div class="big">${moy}x</div></div><div style="background:#0a0a12;padding:10px;border-radius:12px">Crash &lt;2x<div class="big" style="color:#ef4444">${m2}%</div></div></div><div style="background:${coul};color:${coul==='#f59e0b'?'#000':'#fff'};padding:16px;border-radius:14px;margin-top:12px;font-weight:900;font-size:19px">${conseil}</div><div style="font-size:11px;color:#aaa;margin-top:8px">Aviator est aléatoire. Aide de gestion, pas prédiction sûre.</div>`;el.scrollIntoView({behavior:'smooth'})}function reset(){vals=[];document.getElementById('txt').value='';document.getElementById('liste').innerHTML='';document.getElementById('resCard').style.display='none'}function calcul(){let s=parseFloat(document.getElementById('solde').value)||0;let m=parseFloat(document.getElementById('mise').value)||0;let safe=Math.round(s*0.05);document.getElementById('plan').innerHTML=`Mise SAFE = <b>${safe} MGA</b><br>${m>safe?'🚨 TROP GROSSE !':'✅ OK.'}`}</script></body></html>
