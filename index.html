<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FR AVIATOR AUTO V3</title><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><style>*{box-sizing:border-box;font-family:-apple-system,sans-serif}body{margin:0;background:#0a0a12;color:#fff;padding:14px;text-align:center}h1{font-size:24px;margin:5px}.card{background:#1a1a2e;border:1px solid #333;border-radius:18px;padding:16px;margin-top:14px}button{padding:16px;border:0;border-radius:14px;font-weight:900;font-size:16px;width:100%;margin-top:10px}img{width:100%;border-radius:12px;margin-top:10px;border:2px solid #f59e0b}.b-yellow{background:#f59e0b;color:#000}.b-green{background:#16a34a;color:#fff}.pill{display:inline-block;padding:8px 12px;border-radius:20px;font-weight:800;margin:3px;background:#333}.big{font-size:22px;font-weight:900}</style></head><body>
<h1>✈️ FR AVIATOR <span style="color:#f59e0b">AUTO V3</span></h1><div style="color:#aaa;font-size:12px">CAPTURE ➡️ BAMMM ➡️ RÉPONSE SEULE</div>
<div class="card"><h3 style="margin:0">📸 Mets ta capture</h3><input type="file" accept="image/*" id="f" style="display:none" onchange="go(event)"><button class="b-yellow" onclick="document.getElementById('f').click()">📸 UPLOAD CAPTURE - AUTO</button><img id="prev" style="display:none"><div id="status" style="margin-top:10px;font-size:14px;color:#f59e0b"></div><div id="liste"></div></div>
<div class="card" id="resCard" style="display:none"><h3 style="margin:0">🎯 RÉPONSE AUTO</h3><div id="res"></div></div>
<div class="card"><h3 style="margin:0">💰 Mise</h3><input id="solde" type="number" value="6000" placeholder="Solde MGA" style="width:100%;padding:12px;border-radius:10px;background:#0a0a12;color:#fff;border:1px solid #444;margin-top:8px"><input id="mise" type="number" value="4000" placeholder="Mise MGA" style="width:100%;padding:12px;border-radius:10px;background:#0a0a12;color:#fff;border:1px solid #444;margin-top:8px"><button class="b-yellow" onclick="calcul()">💰 CALCULER MISE SAFE</button><div id="plan" style="margin-top:10px"></div></div>
<script>
async function go(e){
let file=e.target.files[0]; if(!file) return;
let url=URL.createObjectURL(file); let im=document.getElementById('prev'); im.src=url; im.style.display='block';
document.getElementById('status').innerText='⏳ Je lis ta capture... 5 secondes...';
try{
let r=await Tesseract.recognize(file,'eng');
let text=r.data.text; console.log(text);
let matches=text.match(/\d+\.\d{1,2}\s*x?/gi)||[];
let vals=[...new Set(matches.map(m=>parseFloat(m.replace('x',''))).filter(v=>v>=1 && v<=1000))].slice(0,12);
if(vals.length<3){
document.getElementById('status').innerHTML='⚠️ J\'ai pas bien lu. Retente avec une capture plus claire, bien zoomée sur les chiffres en haut.<br><small>Texte trouvé: '+text.slice(0,200)+'</small>';
return;
}
document.getElementById('status').innerText='✅ Lu ! '+vals.length+' chiffres trouvés';
document.getElementById('liste').innerHTML=vals.map(v=>`<span class="pill">${v}x</span>`).join('');
analyser(vals);
}catch(err){document.getElementById('status').innerText='❌ Erreur lecture. Réessaie.'}
}
function analyser(vals){
let moy=(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2);
let m2=Math.round(vals.filter(x=>x<2).length/vals.length*100);
let el=document.getElementById('resCard'); el.style.display='block';
let conseil,coul;
if(m2>=80){conseil='🛑 STOP - NE JOUE PAS. '+m2+'% crash sous 2x';coul='#dc2626'}
else if(m2>=60){conseil='⚠️ PRUDENT - Cashout 1.50x seulement';coul='#f59e0b'}
else{conseil='✅ GO - Cashout 2.00x - Tu peux jouer';coul='#16a34a'}
document.getElementById('res').innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><div style="background:#0a0a12;padding:10px;border-radius:12px">Moyenne<div class="big">${moy}x</div></div><div style="background:#0a0a12;padding:10px;border-radius:12px">Crash &lt;2x<div class="big" style="color:#ef4444">${m2}%</div></div></div><div style="background:${coul};color:${coul==='#f59e0b'?'#000':'#fff'};padding:16px;border-radius:14px;margin-top:12px;font-weight:900;font-size:18px">${conseil}</div><div style="font-size:11px;color:#aaa;margin-top:8px">Aviator est aléatoire. Ceci est une aide de gestion, pas une prédiction sûre à 100%.</div>`;
document.getElementById('resCard').scrollIntoView({behavior:'smooth'});
}
function calcul(){let s=parseFloat(document.getElementById('solde').value)||0;let m=parseFloat(document.getElementById('mise').value)||0;let safe=Math.round(s*0.05);document.getElementById('plan').innerHTML=`Mise SAFE = <b>${safe} MGA</b><br>${m>safe?'🚨 TROP GROSSE ! Tu risques tout en 1 tour.':'✅ OK.'}`}
</script></body></html>
