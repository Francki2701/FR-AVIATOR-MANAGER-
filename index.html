<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FR AVIATOR CAPTURE V2</title><style>*{box-sizing:border-box;font-family:-apple-system,sans-serif}body{margin:0;background:#0a0a12;color:#fff;padding:14px}h1{font-size:22px;margin:0}.card{background:#1a1a2e;border:1px solid #333;border-radius:18px;padding:14px;margin-top:14px}input{width:100%;padding:12px;border-radius:10px;border:1px solid #444;background:#0a0a12;color:#fff;font-size:16px;margin-top:6px}button{padding:14px;border:0;border-radius:12px;font-weight:800;font-size:15px;margin-top:10px}img{width:100%;border-radius:12px;margin-top:10px;border:2px solid #f59e0b}.b-yellow{background:#f59e0b;color:#000;width:100%}.b-green{background:#16a34a;color:#fff;width:100%}.b-red{background:#dc2626;color:#fff}.b-ghost{background:#2a2a3e;color:#fff;width:100%}.pill{display:inline-block;padding:8px 12px;border-radius:20px;font-weight:800;margin:3px;background:#333}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.grid button{font-size:14px;padding:12px}.box{background:#0a0a12;border:1px solid #333;border-radius:12px;padding:10px;text-align:center}.big{font-size:20px;font-weight:900}</style></head><body>
<h1>✈️ FR AVIATOR <span style="color:#f59e0b">CAPTURE V2</span></h1><div style="color:#aaa;font-size:12px">CAPTURE ➡️ BOUTONS ➡️ BAMMM RÉPONSE</div>
<div class="card"><h3 style="margin:0">1. 📸 Ta Capture Bet261</h3><input type="file" accept="image/*" onchange="loadImg(event)" style="display:none" id="f"><button class="b-yellow" onclick="document.getElementById('f').click()">📸 UPLOAD TA CAPTURE</button><img id="prev" style="display:none"><div id="msg" style="font-size:12px;color:#f59e0b;margin-top:8px"></div></div>
<div class="card"><h3 style="margin:0">2. ⚡ Clique les chiffres que tu vois</h3><p style="font-size:12px;color:#aaa">Exemple : 1.64, 1.58, 1.30, 1.02, 1.21... Clique-les vite.</p><div class="grid"><button class="b-ghost" onclick="add(1.02)">1.02x</button><button class="b-ghost" onclick="add(1.21)">1.21x</button><button class="b-ghost" onclick="add(1.30)">1.30x</button><button class="b-ghost" onclick="add(1.58)">1.58x</button><button class="b-ghost" onclick="add(1.64)">1.64x</button><button class="b-ghost" onclick="add(2.00)">2.00x</button><button class="b-ghost" onclick="add(2.57)">2.57x</button><button class="b-ghost" onclick="add(5.00)">5.00x</button><button class="b-ghost" onclick="add(10)">10x+</button></div><div style="margin-top:10px">Autre chiffre : <input id="custom" type="number" step="0.01" placeholder="Ex: 3.45"><button class="b-ghost" onclick="add(parseFloat(document.getElementById('custom').value)))">+ Ajouter</button></div><div id="liste" style="margin-top:10px"></div><button class="b-ghost" onclick="effacer()">🗑️ Effacer tout</button></div>
<div class="card"><h3 style="margin:0">3. 🎯 RÉPONSE INSTANTANÉE</h3><button class="b-green" onclick="analyser()">🚀 BAMMM - ANALYSER</button><div id="res" style="display:none;margin-top:12px"></div></div>
<div class="card"><h3 style="margin:0">4. 💰 Ta Mise</h3>Solde MGA <input id="solde" type="number" value="6000">Mise MGA <input id="mise" type="number" value="4000"><button class="b-yellow" onclick="calcul()">💰 CALCULER</button><div id="plan" style="margin-top:10px;font-size:13px;line-height:1.7"></div></div>
<script>let vals=[];function loadImg(e){let r=new FileReader();r.onload=function(){let im=document.getElementById('prev');im.src=r.result;im.style.display='block';document.getElementById('msg').innerText='✅ Capture reçue ! Maintenant clique les chiffres en bas.'};r.readAsDataURL(e.target.files[0])}function add(v){if(!v)return;vals.push(v);show();}function show(){document.getElementById('liste').innerHTML=vals.map(v=>`<span class="pill">${v}x</span>`).join('')+` <br><small>${vals.length} résultats</small>`}function effacer(){vals=[];show()}function analyser(){if(vals.length<3){alert('Clique au moins 3 chiffres');return}let moy=(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2);let m2=Math.round(vals.filter(x=>x<2).length/vals.length*100);let el=document.getElementById('res');el.style.display='block';let conseil,coul;if(m2>=80){conseil='🛑 STOP - NE JOUE PAS. '+m2+'% crash sous 2x. Attends 2-3 tours.';coul='#dc2626'}else if(m2>=60){conseil='⚠️ PRUDENT - Cashout 1.50x seulement. Pas de 2x maintenant.';coul='#f59e0b'}else{conseil='✅ GO - Cashout 2.00x. Phase normale, tu peux jouer 1 tour.';coul='#16a34a'}el.innerHTML=`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="box">Moyenne<div class="big">${moy}x</div></div><div class="box">Crash <2x<div class="big" style="color:#ef4444">${m2}%</div></div></div><div style="background:${coul};color:${coul==='#f59e0b'?'#000':'#fff'};padding:14px;border-radius:12px;margin-top:10px;font-weight:900;font-size:16px;text-align:center">${conseil}</div><div style="font-size:12px;color:#aaa;margin-top:8px">Basé sur tes ${vals.length} derniers résultats. Aviator reste aléatoire, ceci est une aide de gestion, pas une prédiction.</div>`}function calcul(){let s=parseFloat(document.getElementById('solde').value)||0;let m=parseFloat(document.getElementById('mise').value)||0;let safe=Math.round(s*0.05);document.getElementById('plan').innerHTML=`Mise SAFE pour ${s} MGA = <b>${safe} MGA</b><br>${m>safe?`🚨 Ta mise ${m} est TROP GROSSE ! Tu peux tout perdre en 1 tour.`:`✅ Ta mise ${m} est OK.`}<br>Si tu gagnes à 2x : +${m} MGA | Si tu perds : -${m} MGA`}</script></body></html>
